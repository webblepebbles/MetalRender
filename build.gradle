plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.1' // git testing testing
    id 'maven-publish'
}

group = "com.pebbles_boon.metalrender"
version = "v2.0.2"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}
repositories {

    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
        maven {
            name = "LWJGL"
            url = "https://repo.lwjgl.org/"
        }
}
dependencies {
    minecraft "com.mojang:minecraft:26.3"
    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:0.163.0+26.3"
    implementation "org.lwjgl:lwjgl:3.3.3"
    implementation "org.lwjgl:lwjgl-glfw:3.3.3"
    implementation "org.lwjgl:lwjgl:3.3.3:natives-macos"
    implementation "org.lwjgl:lwjgl-glfw:3.3.3:natives-macos"
    implementation 'org.joml:joml:1.10.5'
}

loom {
    splitEnvironmentSourceSets()

    runs {
        client {
            client()
            source sourceSets.client
            vmArg "-Djava.library.path=${projectDir}/src/main/resources"
            vmArg "--enable-preview"
            vmArg "--enable-native-access=ALL-UNNAMED"
            if (project.hasProperty('zgc')) {
                vmArg "-XX:+UseZGC"
            } else {
                vmArg "-XX:+UseG1GC"
                vmArg "-XX:G1HeapRegionSize=8m"
            }
            vmArg "-Xmx8g"
            vmArg "-Xms3g"
            vmArg "-XX:+AlwaysPreTouch"
            if (!project.hasProperty('nojfr')) {
                vmArg "-XX:StartFlightRecording=filename=${projectDir}/run/logs/metalrender.jfr,settings=profile,dumponexit=true"
            }
            
            if (project.hasProperty('gl2metal')) {
                vmArg "-Dmetalrender.gl2metal=true"
            }
            
            ['state', 'drawcalls', 'buffers', 'textures', 'shaders', 'fbos', 'vaos', 'debug'].each { category ->
                if (project.hasProperty("gl2metal.${category}")) {
                    vmArg "-Dmetalrender.gl2metal.${category}=true"
                }
                 programArgs "--quickPlaySingleplayer", "New World"
            }
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
    options.compilerArgs += ['--enable-preview']
}
tasks.register('compileShaders', Exec) {
    inputs.dir('src/main/resources/native/shaders')
    outputs.file('src/main/resources/shaders.metallib')
    commandLine 'bash', "${projectDir}/compile_shaders.sh"
}
tasks.named('processResources') {
    dependsOn 'compileShaders'
}
    jar {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from('src/main/resources/native') {
            include 'metalrender.h', 'metalrender.mm'
            into 'native'
        }
        from('LICENSE.md')
    }
